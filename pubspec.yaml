name: app_test
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  http: ^1.2.2
  provider: ^6.1.2
  geolocator: ^13.0.4
  flutter_map_geojson: ^1.0.8
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  shared_preferences: ^2.3.5
  camera: ^0.11.0+2
  path_provider: ^2.1.5
  path: ^1.9.0
  firebase_messaging: ^16.0.0
  flutter_local_notifications: ^19.4.0
  device_info_plus: ^11.3.0
  firebase_core: ^4.0.0
  pusher_channels_flutter: ^2.0.0
  audioplayers: ^6.5.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^3.0.0
  photo_view: ^0.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - geojson/amenity_points.geojson
    - geojson/amenity_polygons.geojson
    - geojson/landcover.geojson
    - geojson/power_line_columns.geojson
    - geojson/power_lines.geojson
    - geojson/roads.geojson
    - assets/LogoAlertaUnida.png
    - android/app/src/main/res/raw/alert_sound.mp3
    - assets/chalecoverde.png
    - assets/chalecoblanco.png
    - assets/chalecorojo.png
    - assets/chaleco-naranja.png
    - assets/chalecoazul.png
    - assets/map.png
    - assets/satellite.png

flutter_icons:
  android: true
  ios: true
  image_path: "assets/LogoAlertaUnida.png"
  adaptive_icon_background: "assets/LogoAlertaUnida.png"


dependency_overrides:
  geolocator_android: 4.5.0
